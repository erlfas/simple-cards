{% extends 'base.html' %}

{% block title %}Sign In{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto my-12 bg-white p-8 rounded-xl border border-neutral-200">
    <div class="text-center mb-8">
        <div class="w-10 h-10 rounded-lg bg-black text-white flex items-center justify-center mx-auto mb-3">
            <i data-lucide="layers" class="w-5 h-5"></i>
        </div>
        <h2 class="text-xl font-bold tracking-tight text-neutral-900">Simple Cards</h2>
        <p class="text-xs text-neutral-500 mt-1">Sign in to your account</p>
    </div>

    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-xs font-semibold text-neutral-700 mb-1">Username</label>
            <input type="text" name="username" autofocus required class="w-full px-3.5 py-2 bg-neutral-50 border border-neutral-300 rounded-lg focus:outline-none focus:border-black text-xs">
        </div>
        <div>
            <label class="block text-xs font-semibold text-neutral-700 mb-1">Password</label>
            <input type="password" name="password" required class="w-full px-3.5 py-2 bg-neutral-50 border border-neutral-300 rounded-lg focus:outline-none focus:border-black text-xs">
        </div>
        <button type="submit" class="w-full py-2 bg-black hover:bg-neutral-800 text-white font-semibold text-xs rounded-lg transition">
            Sign In
        </button>
    </form>

    <div class="mt-6 text-center text-xs text-neutral-500">
        Don't have an account? 
        <a href="{% url 'accounts:register' %}" class="text-black font-semibold hover:underline">Sign up</a>
    </div>
</div>
{% endblock %}

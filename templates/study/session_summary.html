{% extends 'base.html' %}

{% block title %}Session Completed{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-12 bg-white p-8 rounded-xl border border-neutral-200 text-center">
    <div class="w-12 h-12 rounded-xl bg-black text-white flex items-center justify-center mx-auto mb-4 shadow-sm">
        <i data-lucide="check-circle-2" class="w-6 h-6"></i>
    </div>
    
    <h2 class="text-xl font-bold tracking-tight text-neutral-900">Session Completed</h2>
    <p class="text-xs text-neutral-500 mt-1">
        Cards reviewed and intervals updated.
    </p>

    <div class="my-6 p-4 bg-neutral-50 rounded-xl border border-neutral-200 flex justify-around">
        <div>
            <span class="block text-2xl font-bold text-neutral-900" id="cardsDoneCount">--</span>
            <span class="text-[10px] text-neutral-500 font-semibold uppercase">Cards Studied</span>
        </div>
        <div>
            <span class="block text-2xl font-bold text-neutral-900">{{ user.profile.streak_days }}d</span>
            <span class="text-[10px] text-neutral-500 font-semibold uppercase">Streak</span>
        </div>
    </div>

    <div class="flex justify-center gap-3">
        <a href="{% url 'decks:deck_list' %}" class="px-4 py-2 bg-neutral-100 text-neutral-800 font-semibold text-xs rounded-lg hover:bg-neutral-200 transition">
            Decks
        </a>
        <a href="{% url 'analytics:dashboard' %}" class="px-4 py-2 bg-black hover:bg-neutral-800 text-white font-semibold text-xs rounded-lg transition">
            Analytics
        </a>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    const urlParams = new URLSearchParams(window.location.search);
    const count = urlParams.get('count') || 'Done';
    document.getElementById('cardsDoneCount').innerText = count;
</script>
{% endblock %}

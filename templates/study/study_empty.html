{% extends 'base.html' %}

{% block title %}Done For Now{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-12 bg-white p-8 rounded-xl border border-neutral-200 text-center">
    <div class="w-12 h-12 rounded-xl bg-neutral-100 text-black flex items-center justify-center mx-auto mb-4 border border-neutral-200">
        <i data-lucide="check" class="w-6 h-6"></i>
    </div>
    
    <h2 class="text-xl font-bold tracking-tight text-neutral-900">All Caught Up!</h2>
    <p class="text-xs text-neutral-500 mt-2 mb-6">
        No cards due for review at this time.
    </p>

    <div class="flex justify-center gap-3">
        <a href="{% url 'decks:deck_list' %}" class="px-4 py-2 bg-neutral-100 text-neutral-800 font-semibold text-xs rounded-lg hover:bg-neutral-200 transition">
            Back to Decks
        </a>
        <a href="{% url 'analytics:dashboard' %}" class="px-4 py-2 bg-black hover:bg-neutral-800 text-white font-semibold text-xs rounded-lg transition">
            Analytics
        </a>
    </div>
</div>
{% endblock %}

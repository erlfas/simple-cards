{% extends 'base.html' %}

{% block title %}Delete Deck{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-12 bg-white p-8 rounded-xl border border-neutral-200 text-center">
    <h2 class="text-xl font-bold tracking-tight text-neutral-900">Delete "{{ deck.name }}"?</h2>
    <p class="text-xs text-neutral-500 mt-2 mb-6">
        This will permanently delete this deck and all of its <strong>{{ deck.total_cards }}</strong> flashcards.
    </p>

    <form method="post" class="flex justify-center space-x-3">
        {% csrf_token %}
        <a href="{% url 'decks:deck_detail' deck.pk %}" class="px-4 py-2 bg-neutral-100 text-neutral-700 font-semibold text-xs rounded-lg hover:bg-neutral-200 transition">Cancel</a>
        <button type="submit" class="px-5 py-2 bg-black hover:bg-neutral-800 text-white font-semibold text-xs rounded-lg transition">Delete Deck</button>
    </form>
</div>
{% endblock %}

{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto my-6 bg-white p-6 rounded-xl border border-neutral-200">
    <div class="flex items-center space-x-3 mb-6">
        <a href="{% url 'decks:deck_list' %}" class="text-neutral-400 hover:text-black">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
        </a>
        <h1 class="text-xl font-bold tracking-tight text-neutral-900">{{ title }}</h1>
    </div>

    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-xs font-semibold text-neutral-700 mb-1">Deck Name</label>
            {{ form.name }}
            {% for error in form.name.errors %}
                <p class="text-xs text-neutral-900 mt-1 font-semibold">{{ error }}</p>
            {% endfor %}
        </div>

        <div>
            <label class="block text-xs font-semibold text-neutral-700 mb-1">Description (Optional)</label>
            {{ form.description }}
        </div>

        <div class="flex justify-end space-x-2 pt-4 border-t border-neutral-100">
            <a href="{% url 'decks:deck_list' %}" class="px-4 py-2 bg-neutral-100 text-neutral-700 font-semibold text-xs rounded-lg hover:bg-neutral-200 transition">Cancel</a>
            <button type="submit" class="px-5 py-2 bg-black hover:bg-neutral-800 text-white font-semibold text-xs rounded-lg transition">Save Deck</button>
        </div>
    </form>
</div>
{% endblock %}
